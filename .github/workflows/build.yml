name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          # SDK और अन्य चीजों को अपने आप कॉन्फ़िगर करने के लिए
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaFinderAPK
          path: bin/*.apk
